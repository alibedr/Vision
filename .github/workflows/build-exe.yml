name: Vision exe derle

# Windows'ta Release derlemesi yapar ve hazır exe paketini (zip) GitHub Releases'a koyar.
# Her dal kendi ön sürümünü günceller: "build-<dal-adı>".
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Güncel Windows imajlarında .NET Framework 4.6.1 hedefleme paketi yok: başvuru derlemeleri NuGet'ten alınır
      - name: .NET 4.6.1 başvuru derlemeleri
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net461/1.0.3 -OutFile ref.zip
          Expand-Archive ref.zip -DestinationPath refasm -Force

      # Sentinel sayfası için Edge WebView2 (packages.config ile aynı sürüm, aynı klasör düzeni)
      - name: WebView2 paketi
        shell: pwsh
        run: |
          $v = "1.0.1072.54"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath "packages\Microsoft.Web.WebView2.$v" -Force

      - name: Derle (Release)
        shell: pwsh
        run: |
          $root = (Resolve-Path refasm\build).Path + "\"
          msbuild Vision.csproj /p:Configuration=Release /p:Platform=AnyCPU "/p:TargetFrameworkRootPath=$root" /v:minimal /nologo 2>&1 | Tee-Object build.log
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern ': (error|warning) ' | ForEach-Object {
            $kind = if ($_.Line -match ': error ') { 'error' } else { 'warning' }
            Write-Output "::${kind}::$($_.Line.Trim())"
          }
          exit $code

      - name: Paketle
        shell: pwsh
        run: |
          $out = "HazirExe\Vision"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item bin\Release\Vision.exe $out
          if (Test-Path bin\Release\Vision.exe.config) { Copy-Item bin\Release\Vision.exe.config $out }
          # Edge WebView2 (Sentinel sayfası): yönetilen DLL'ler + mimariye göre yükleyici
          Copy-Item bin\Release\Microsoft.Web.WebView2.Core.dll, bin\Release\Microsoft.Web.WebView2.WinForms.dll $out
          $pkg = (Get-ChildItem packages -Directory -Filter "Microsoft.Web.WebView2.*" | Select-Object -First 1).FullName
          foreach ($rid in "win-x86", "win-x64", "win-arm64") {
            $src = if (Test-Path "bin\Release\runtimes\$rid\native\WebView2Loader.dll") { "bin\Release\runtimes\$rid\native\WebView2Loader.dll" } else { "$pkg\runtimes\$rid\native\WebView2Loader.dll" }
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force "$out\runtimes\$rid\native" | Out-Null
              Copy-Item $src "$out\runtimes\$rid\native"
            }
          }
          if (Test-Path bin\Release\WebView2Loader.dll) { Copy-Item bin\Release\WebView2Loader.dll $out }
          Get-ChildItem -Recurse $out | Select-Object FullName
          Copy-Item -Recurse bin\Release\Yardim $out
          Compress-Archive -Path $out -DestinationPath Vision.zip -Force

      - name: Ön sürümü güncelle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          $tag = "build-$branch"
          $notes = "Otomatik derleme: ${{ github.sha }}. Zip'i açıp Vision.exe'yi çalıştırın (.NET Framework 4.6.1+)."
          gh release delete $tag --yes --cleanup-tag 2>$null
          # Etiketin silinmesi GitHub'da birkaç saniye sürebilir: oluşturma birkaç kez denenir
          for ($i = 1; $i -le 5; $i++) {
            Start-Sleep -Seconds (3 * $i)
            gh release create $tag Vision.zip --prerelease --target "${{ github.sha }}" --title "Vision derlemesi ($branch)" --notes $notes
            if ($LASTEXITCODE -eq 0) { exit 0 }
            # Sürüm oluştuysa ama dosya yüklenemediyse dosyayı yeniden yükle
            gh release upload $tag Vision.zip --clobber 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          exit 1
